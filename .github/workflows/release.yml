# ==============================================
# Release ワークフロー
#
# 役割:
#   frontend と backend を両方ビルドして zip に固め
#   GitHub Release を自動作成してダウンロードできるようにする
#
# トリガー:
#   ローカルで以下を実行したとき
#     git tag v1.0.0
#     git push --tags
#   → v*.*.* 形式のタグが push されると自動で走る
#
# ブランチ戦略との関係:
#   feature → develop → main (Approve) → タグ付け → Release
#   リリースは main にマージ済みのコードにタグを打って行う
# ==============================================

# Actions タブに表示されるワークフロー名
name: Release

# ---------- トリガー設定 ----------
on:
  push:
    tags:
      - "v*.*.*" # v1.0.0 / v1.2.3 など semver 形式のタグが push された時だけ実行
        # ブランチの push では実行されない

# ---------- ジョブ定義 ----------
jobs:
  # ══════════════════════════════════════════════
  # ジョブ① build-frontend
  #   frontend (NestJS Commander CLI) をビルドして zip に固める
  # ══════════════════════════════════════════════
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend # コマンドは frontend/ 内で実行

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x" # LTS の 20.x を使用
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係インストール
        # --ignore-scripts = nfc-pcsc のネイティブビルドをスキップ（CI に Python 不要）
        run: npm ci --ignore-scripts

      - name: TypeScript をコンパイル
        # src/*.ts → dist/*.js に変換
        run: npm run build

      - name: frontend を zip に圧縮
        # dist/ + package.json をまとめる
        # github.ref_name = タグ名 (例: v1.0.0)
        run: zip -r ../../frontend-${{ github.ref_name }}.zip dist/ package.json

      - name: zip を Artifacts に保存
        uses: actions/upload-artifact@v4
        with:
          name: frontend-zip # 次のジョブで参照するための名前
          path: frontend-${{ github.ref_name }}.zip

  # ══════════════════════════════════════════════
  # ジョブ② build-backend
  #   backend (NestJS HTTP API) をビルドして zip に固める
  # ══════════════════════════════════════════════
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend # コマンドは backend/ 内で実行

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 依存関係インストール（全パッケージ）
        run: npm ci # tsc を使うので devDependencies も必要

      - name: TypeScript をコンパイル
        run: npm run build

      - name: 本番用 node_modules を再インストール
        # --omit=dev = jest や ts-node などの開発ツールを除外してサイズを削減
        run: npm ci --omit=dev

      - name: backend を zip に圧縮
        # dist/ + node_modules(本番のみ) + package.json をまとめる
        # Azure App Service はこの zip をそのまま展開して node dist/main.js で起動する
        run: zip -r ../../backend-${{ github.ref_name }}.zip dist/ node_modules/ package.json

      - name: zip を Artifacts に保存
        uses: actions/upload-artifact@v4
        with:
          name: backend-zip
          path: backend-${{ github.ref_name }}.zip

  # ══════════════════════════════════════════════
  # ジョブ③ release
  #   両方のビルドが完了した後に GitHub Release を作成し
  #   zip ファイルを添付してダウンロードできるようにする
  # ══════════════════════════════════════════════
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend] # 両方のビルドが成功した後に実行

    permissions:
      contents: write # GitHub Release の作成・編集に必要な権限

    steps:
      - uses: actions/checkout@v4

      # 前のジョブでアップロードした zip を取得
      - name: frontend の zip をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: frontend-zip # build-frontend でアップロードした名前と一致させる

      - name: backend の zip をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: backend-zip # build-backend でアップロードした名前と一致させる

      - name: GitHub Release を作成して zip を添付
        uses: softprops/action-gh-release@v2 # GitHub 公式ではなく人気の OSSアクション
        with:
          tag_name: ${{ github.ref_name }} # トリガーになったタグ名 (例: v1.0.0)
          name: Release ${{ github.ref_name }} # Release のタイトル
          # contains(..., '-') = タグに "-" が含まれる場合はプレリリース扱い
          # 例: v1.0.0-beta → prerelease: true / v1.0.0 → prerelease: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            frontend-${{ github.ref_name }}.zip
            backend-${{ github.ref_name }}.zip
          body: |
            ## PaSoRi FeliCa Reader ${{ github.ref_name }}

            ### frontend (CLI) の使い方
            ```bash
            unzip frontend-${{ github.ref_name }}.zip
            npm install --ignore-scripts
            node dist/main.js read            # カード情報表示
            node dist/main.js read --mode balance  # 残高読み取り
            ```

            ### backend (Azure App Service) のデプロイ
            ```bash
            unzip backend-${{ github.ref_name }}.zip
            # Azure App Service にアップロードして起動
            node dist/main.js   # PORT=8080 で起動
            ```

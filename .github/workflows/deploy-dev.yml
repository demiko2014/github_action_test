# ==============================================
# Backend デプロイワークフロー - dev 環境
#
# ブランチ戦略:
#   feature/* → develop → staging → main
#                  ↓
#                 dev  ← このファイルが担当
#
# トリガー: develop ブランチへのマージ
# デプロイ先: Azure App Service (dev)
#
# 事前準備（初回のみ）:
#   1. Azure Portal で App Service を作成（Node.js 20 / Linux）
#   2. App Service の「発行プロファイル」をダウンロード
#   3. GitHub Settings→Environments で「dev」を作成
#   4. dev Environment の Secrets に以下を登録:
#        AZURE_WEBAPP_NAME           = App Service のリソース名
#        AZURE_WEBAPP_PUBLISH_PROFILE = 発行プロファイルの XML 全文
# ==============================================

# Actions タブに表示されるワークフロー名（ファイル名でなくこちらが表示される）
name: Deploy to dev

# 個別のワークフロー実行のタイトル（実行一覧画面に表示される）
# 例: "Deploy to dev: feat: add card scan endpoint"
run-name: "Deploy to dev: ${{ github.event.head_commit.message || github.event_name }}"

# ---------- トリガー設定 ----------
on:
  push:
    branches:
      - develop # develop マージ → dev 環境へデプロイ
    paths:
      - "backend/**" # backend/ 以外の変更（README 等）ではデプロイしない

  workflow_dispatch: # 手動実行（緊急デプロイ・再デプロイ用）

# ---------- 共通設定 ----------
env:
  NODE_VERSION: "20.x"

# ---------- ジョブ定義 ----------
jobs:
  deploy:
    name: Build & Deploy to dev
    runs-on: ubuntu-latest

    # GitHub Environments の「dev」を指定する
    # → この環境に登録したシークレット（AZURE_WEBAPP_NAME 等）が使われる
    environment: dev

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 依存関係インストール（全パッケージ）
        run: npm ci # tsc を使うため devDependencies も含めてインストール

      - name: TypeScript をコンパイル
        run: npm run build # src/*.ts → dist/*.js

      - name: 本番用 node_modules を再インストール
        run: npm ci --omit=dev # jest や ts-node などの開発ツールを除外してサイズ削減

      - name: デプロイパッケージを zip に圧縮
        run: zip -r ../backend-deploy.zip dist/ node_modules/ package.json

      - name: Azure App Service (dev) にデプロイ
        # AZURE_WEBAPP_PUBLISH_PROFILE が未登録の場合はスキップ（Azure 未設定時のエラー防止）
        if: secrets.AZURE_WEBAPP_PUBLISH_PROFILE != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }} # dev Environment の Secret
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} # dev Environment の Secret
          package: backend-deploy.zip

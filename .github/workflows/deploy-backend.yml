# ==============================================
# Backend デプロイワークフロー（Azure App Service）
#
# ブランチ戦略:
#   feature/* → develop → staging → main
#                  ↓          ↓        ↓
#                 dev        stg      prd   ← デプロイ先の環境
#
# このファイルの役割:
#   各ブランチへのマージをトリガーに対応環境へ自動デプロイする
#   ※ テストは ci-backend.yml が担当（Branch Protection で通過を必須に設定）
#
# GitHub Environments を使う理由:
#   - 環境ごとに別々のシークレット（App Service 名・発行プロファイル）を管理できる
#   - prd 環境には「Required reviewers」を設定してデプロイ前に承認を求められる
#   - Actions の実行履歴で「どの環境に何をデプロイしたか」が一目でわかる
#
# 事前準備（初回のみ）:
#   1. Azure Portal で App Service を 3 つ作成（dev/stg/prd 各 Node.js 20 / Linux）
#   2. 各 App Service の「発行プロファイル」をダウンロード
#   3. GitHub Settings→Environments で「dev」「stg」「prd」を作成
#   4. 各 Environment の Secrets に以下を登録:
#        AZURE_WEBAPP_NAME           = App Service のリソース名
#        AZURE_WEBAPP_PUBLISH_PROFILE = ダウンロードした発行プロファイルの XML 全文
#   5. prd Environment の「Required reviewers」に承認者を追加（推奨）
# ==============================================

# Actions タブに表示されるワークフロー名
name: Deploy Backend to Azure

# ---------- トリガー設定 ----------
on:
  push:
    branches:
      - develop # develop マージ → dev 環境へデプロイ
      - staging # staging マージ → stg 環境へデプロイ
      - main # main マージ    → prd 環境へデプロイ
    paths:
      - "backend/**" # backend/ 以外の変更（README 等）ではデプロイしない

  workflow_dispatch: # 手動でも実行できるようにする（緊急デプロイ・再デプロイ用）
    inputs:
      environment:
        description: "デプロイ先の環境を選択"
        required: true
        default: "dev"
        type: choice
        options: [dev, stg, prd] # プルダウンで環境を選べる

# ---------- 共通設定 ----------
env:
  NODE_VERSION: "20.x" # デプロイに使う Node.js バージョン

# ---------- ジョブ定義 ----------
jobs:
  # ════════════════════════════════════════════════════════
  # ジョブ deploy-dev
  #   develop ブランチへのマージ → dev 環境へデプロイ
  # ════════════════════════════════════════════════════════
  deploy-dev:
    name: Deploy to dev
    # develop マージ時、または workflow_dispatch で env=dev の時だけ実行する
    # secrets.AZURE_WEBAPP_PUBLISH_PROFILE が未登録の場合はスキップ（Azure 未設定時のエラー防止）
    if: |
      (github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'))
      && secrets.AZURE_WEBAPP_PUBLISH_PROFILE != ''
    runs-on: ubuntu-latest
    # GitHub Environments の「dev」を指定する
    # → この環境に登録したシークレット（AZURE_WEBAPP_NAME 等）が使われる
    environment: dev

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 依存関係インストール（全パッケージ）
        run: npm ci # tsc を使うため devDependencies も含めてインストール

      - name: TypeScript をコンパイル
        run: npm run build # src/*.ts → dist/*.js

      - name: 本番用 node_modules を再インストール
        run: npm ci --omit=dev # jest や ts-node などの開発ツールを除外してサイズ削減

      - name: デプロイパッケージを zip に圧縮
        run: zip -r ../backend-deploy.zip dist/ node_modules/ package.json

      - name: Azure App Service (dev) にデプロイ
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }} # dev Environment の Secret
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} # dev Environment の Secret
          package: backend-deploy.zip

  # ════════════════════════════════════════════════════════
  # ジョブ deploy-stg
  #   staging ブランチへのマージ → stg 環境へデプロイ
  # ════════════════════════════════════════════════════════
  deploy-stg:
    name: Deploy to stg
    # secrets.AZURE_WEBAPP_PUBLISH_PROFILE が未登録の場合はスキップ
    if: |
      (github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'stg'))
      && secrets.AZURE_WEBAPP_PUBLISH_PROFILE != ''
    runs-on: ubuntu-latest
    # GitHub Environments の「stg」を指定する
    environment: stg

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 依存関係インストール（全パッケージ）
        run: npm ci

      - name: TypeScript をコンパイル
        run: npm run build

      - name: 本番用 node_modules を再インストール
        run: npm ci --omit=dev

      - name: デプロイパッケージを zip に圧縮
        run: zip -r ../backend-deploy.zip dist/ node_modules/ package.json

      - name: Azure App Service (stg) にデプロイ
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }} # stg Environment の Secret
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} # stg Environment の Secret
          package: backend-deploy.zip

  # ════════════════════════════════════════════════════════
  # ジョブ deploy-prd
  #   main ブランチへのマージ → prd 環境へデプロイ
  #   ※ prd Environment に「Required reviewers」を設定すると
  #     デプロイ実行前に承認者の OK が必須になる（本番誤デプロイ防止）
  # ════════════════════════════════════════════════════════
  deploy-prd:
    name: Deploy to prd
    # secrets.AZURE_WEBAPP_PUBLISH_PROFILE が未登録の場合はスキップ
    if: |
      (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prd'))
      && secrets.AZURE_WEBAPP_PUBLISH_PROFILE != ''
    runs-on: ubuntu-latest
    # GitHub Environments の「prd」を指定する
    # → Settings→Environments→prd で Required reviewers を設定すると承認待ちになる
    environment: prd

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 依存関係インストール（全パッケージ）
        run: npm ci

      - name: TypeScript をコンパイル
        run: npm run build

      - name: 本番用 node_modules を再インストール
        run: npm ci --omit=dev

      - name: デプロイパッケージを zip に圧縮
        run: zip -r ../backend-deploy.zip dist/ node_modules/ package.json

      - name: Azure App Service (prd) にデプロイ
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }} # prd Environment の Secret
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} # prd Environment の Secret
          package: backend-deploy.zip

# ==============================================
# Backend デプロイワークフロー（Azure App Service）
#
# ブランチ戦略:
#   feature → develop (PR) → main (PR + Approve) → deploy ← ここ
#
# このファイルの役割:
#   develop→main PR が Approve されてマージされた時に
#   自動でビルド → Azure App Service へデプロイする
#
#   ※ テストは ci-backend.yml が担当
#     Branch Protection で ci-backend の通過を必須にすれば
#     テスト済みのコードだけが main にマージされるので
#     ここで再度テストする必要はない
#
# 事前準備（初回のみ）:
#   1. Azure Portal で App Service を作成（Node.js 20 / Linux）
#   2. App Service の「発行プロファイル」をダウンロード
#   3. GitHub リポジトリ Settings→Secrets→Actions で
#      「AZURE_WEBAPP_PUBLISH_PROFILE」という名前で貼り付ける
# ==============================================

# Actions タブに表示されるワークフロー名
name: Deploy Backend to Azure

# ---------- トリガー設定 ----------
on:
  push:
    branches: [main] # main への push = PR が Approve されてマージされた瞬間
    paths:
      - "backend/**" # backend/ 以外の変更（README 等）ではデプロイしない

  workflow_dispatch: # 手動でも実行できるようにする（緊急デプロイ用）

# ---------- 環境変数（ジョブ間で共有） ----------
env:
  AZURE_WEBAPP_NAME: pasori-backend # ← Azure App Service のリソース名に変更してください
  NODE_VERSION: "20.x" # デプロイに使う Node.js バージョン

# ---------- ジョブ定義 ----------
jobs:
  # ════════════════════════════════
  # ジョブ deploy
  #   ビルド → zip → Azure App Service へアップロード
  #   テストは ci-backend.yml（PR 時）が済ませているので省略
  # ════════════════════════════════
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 依存関係インストール（全パッケージ）
        run: npm ci # devDependencies も含めてインストール（tsc を使うため）

      - name: TypeScript をコンパイル
        # src/*.ts → dist/*.js に変換する（Azure は JS しか実行できない）
        run: npm run build

      - name: 本番用 node_modules を再インストール
        # --omit=dev で jest や ts-node などの開発ツールを除外する
        # → デプロイパッケージのサイズを小さくする
        run: npm ci --omit=dev

      - name: デプロイパッケージを zip に圧縮
        # Azure webapps-deploy は zip ファイルを受け取る
        # dist/        = コンパイル済み JS
        # node_modules/ = 本番用パッケージ（dev 除外済み）
        # package.json  = Azure が Node.js アプリと認識するために必要
        run: zip -r ../backend-deploy.zip dist/ node_modules/ package.json

      - name: Azure App Service にデプロイ
        uses: azure/webapps-deploy@v3 # Microsoft 公式の Azure デプロイアクション
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }} # デプロイ先の App Service 名
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} # GitHub Secrets に保存した Azure の認証情報
          package: backend-deploy.zip # アップロードする zip ファイル

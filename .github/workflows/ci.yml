# -----------------------------------------------
# Test & Build ワークフロー
#
# トリガー:
#   - main / develop ブランチへの push
#   - main / develop ブランチへの Pull Request
#   - 手動実行 (workflow_dispatch)
#
# ジョブ:
#   1. test-frontend  : frontend/ のユニットテスト
#   2. test-backend   : backend/  のユニットテスト
#   3. build-backend  : backend/ TypeScript コンパイル
# -----------------------------------------------
name: Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Actions タブから手動実行を許可

jobs:
  # ── ① frontend テスト ──────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    defaults:
      run:
        working-directory: frontend # コマンドは frontend/ 内で実行

    steps:
      - uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node-version }} をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # nfc-pcsc はネイティブビルド不要
      - name: 依存関係インストール
        run: npm ci --ignore-scripts

      - name: TypeScript 型チェック
        run: npx tsc --noEmit

      - name: ユニットテスト実行
        run: npm run test:ci

      - name: カバレッジを Artifacts にアップロード
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '20.x'
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ── ② backend テスト ───────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    defaults:
      run:
        working-directory: backend # コマンドは backend/ 内で実行

    steps:
      - uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node-version }} をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 依存関係インストール
        run: npm ci

      - name: TypeScript 型チェック
        run: npx tsc --noEmit

      - name: ユニットテスト実行
        run: npm run test:ci

      - name: カバレッジを Artifacts にアップロード
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '20.x'
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ── ③ backend ビルド ────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend] # 両方のテストが通った後にビルド

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: TypeScript をコンパイル
        run: npm run build

      - name: ビルド成果物を Artifacts にアップロード
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7
